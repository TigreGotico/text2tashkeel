[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2tashkeel"
version = "0.1.0"
description = "Tiny standalone Arabic diacritizer (BiLSTM, ONNX) — no torch, no network"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["arabic", "diacritization", "tashkeel", "nlp", "onnx"]
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
bench = ["datasets>=2.0"]
dev = ["pytest>=7.0", "datasets>=2.0"]

[project.scripts]
text2tashkeel = "text2tashkeel.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["text2tashkeel*"]

[tool.setuptools.package-data]
text2tashkeel = ["models/*.onnx", "models/*.json"]
