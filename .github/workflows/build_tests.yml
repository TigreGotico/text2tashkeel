name: Run Tests

on:
  push:
  workflow_dispatch:

jobs:
  build_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package with test dependencies
        run: pip install ".[test]"

      - name: Run tests
        run: pytest tests/
